{% load static %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
{# Transactions modal: include this where you need the transactions popup. #}
{# Data attributes: data-content-type-id, data-object-id for loading list. #}
<div id="transactionsModal" class="transaction-modal-overlay d-none" aria-labelledby="transactionsModalTitle" aria-modal="true" role="dialog">
  <div class="transaction-modal-dialog shadow" onclick="event.stopPropagation()">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 id="transactionsModalTitle" class="h5 mb-0">Field change history</h2>
      <button type="button" onclick="closeTransactionsModal()" class="btn-close" aria-label="Close"></button>
    </div>
    <div id="transactionsModalBody" class="transaction-modal-body">
      {# List or detail partial is loaded here via JS #}
      <p class="small text-body-secondary">Loading…</p>
    </div>
  </div>
</div>

<script>
(function() {
  function initTomSelectWidgets(container) {
    if (typeof TomSelect === 'undefined') return;

    // Large FK tables: Supplier, NSN, etc. — AJAX search
    container.querySelectorAll('select[data-fk-autocomplete="true"]').forEach(function(el) {
      if (el.tomselect) return; // prevent double-init
      var searchUrl = el.dataset.searchUrl;
      new TomSelect(el, {
        valueField: 'value',
        labelField: 'label',
        searchField: ['label'],
        preload: false,
        placeholder: 'Type 3+ characters to search\u2026',
        shouldLoad: function(query) { return query.length >= 3; },
        load: function(query, callback) {
          if (query.length < 3) return callback();
          fetch(searchUrl + '&q=' + encodeURIComponent(query), {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
          })
          .then(function(r) { return r.json(); })
          .then(function(data) { callback(data.results || []); })
          .catch(function() { callback(); });
        },
        render: {
          no_results: function(data, escape) {
            return '<div class="no-results">No results for "' + escape(data.input) + '"</div>';
          },
          option: function(data, escape) {
            return '<div>' + escape(data.label) + '</div>';
          },
          item: function(data, escape) {
            return '<div>' + escape(data.label) + '</div>';
          }
        }
      });
    });

    // Small preloaded selects with enough options — add Tom Select local search
    container.querySelectorAll('select.form-control:not([data-fk-autocomplete])').forEach(function(el) {
      if (el.tomselect) return;
      if (el.options.length > 8) {
        new TomSelect(el, {
          create: false,
          allowEmptyOption: true,
          placeholder: 'Search or select\u2026',
        });
      }
    });
  }

  const modal = document.getElementById('transactionsModal');
  const body = document.getElementById('transactionsModalBody');
  const titleEl = document.getElementById('transactionsModalTitle');

  window.openTransactionsModal = function(contentTypeId, objectId) {
    if (!modal || !body) return;
    if (titleEl) titleEl.textContent = 'Field change history';
    modal.classList.remove('d-none');
    body.innerHTML = '<p class="small text-body-secondary">Loading…</p>';
    var url = '/transactions/list/' + contentTypeId + '/' + objectId + '/';
    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function(r) { return r.text(); })
      .then(function(html) { body.innerHTML = html; })
      .catch(function() { body.innerHTML = '<p class="text-danger">Failed to load transactions.</p>'; });
  };

  /** Open modal to edit a specific field (table, field, old value, new value input + history). Save updates DB and triggers onTransactionSaved. */
  window.openTransactionsEditModal = function(contentTypeId, objectId, fieldName) {
    if (!modal || !body) return;
    if (titleEl) titleEl.textContent = 'Edit field';
    modal.classList.remove('d-none');
    body.innerHTML = '<p class="small text-body-secondary">Loading…</p>';
    var editUrl = '/transactions/edit/' + contentTypeId + '/' + objectId + '/' + encodeURIComponent(fieldName) + '/';
    fetch(editUrl, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        body.innerHTML = html;
        initTomSelectWidgets(body);  // initialize Tom Select on FK autocomplete and preloaded selects
        var form = body.querySelector('#transaction-edit-form');
        var cancelBtn = body.querySelector('#transaction-edit-cancel');
        if (form) {
          form.action = editUrl;
          form.onsubmit = function(e) {
            e.preventDefault();
            var saveBtn = body.querySelector('#transaction-edit-save');
            if (saveBtn) saveBtn.disabled = true;
            var formData = new FormData(form);
            var headers = { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' };
            var csrf = form.querySelector('[name=csrfmiddlewaretoken]');
            if (csrf && csrf.value) headers['X-CSRFToken'] = csrf.value;
            fetch(editUrl, { method: 'POST', body: formData, headers: headers, credentials: 'same-origin' })
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data.success && typeof window.onTransactionSaved === 'function') window.onTransactionSaved(data);
                closeTransactionsModal();
              })
              .catch(function() {
                if (saveBtn) saveBtn.disabled = false;
                alert('Failed to save.');
              });
          };
        }
        if (cancelBtn) cancelBtn.onclick = closeTransactionsModal;
      })
      .catch(function() { body.innerHTML = '<p class="text-danger">Failed to load.</p>'; });
  };

  window.closeTransactionsModal = function() {
    if (modal) modal.classList.add('d-none');
  };

  window.showTransactionDetail = function(pk) {
    if (!body) return;
    body.innerHTML = '<p class="small text-body-secondary">Loading…</p>';
    fetch('/transactions/' + pk + '/')
      .then(function(r) { return r.text(); })
      .then(function(html) { body.innerHTML = html; })
      .catch(function() { body.innerHTML = '<p class="text-danger">Failed to load transaction.</p>'; });
  };

  window.backToTransactionsList = function(contentTypeId, objectId) {
    if (contentTypeId && objectId) openTransactionsModal(contentTypeId, objectId);
  };

  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeTransactionsModal();
  });
})();
</script>
