{% load humanize %}
<div class="vstack gap-3">
  <div class="d-flex justify-content-between align-items-center">
    <button
      type="button"
      onclick="backToTransactionsList({{ transaction.content_type_id }}, {{ transaction.object_id }})"
      class="btn btn-link btn-sm p-0"
    >
      ← Back to list
    </button>
  </div>

  <dl class="row g-2 small mb-0">
    <div class="col-12 col-sm-6">
      <dt class="text-body-secondary">Date / time</dt>
      <dd class="fw-semibold mb-0">{{ transaction.created_at|date:"M j, Y g:i A" }}</dd>
    </div>
    <div class="col-12 col-sm-6">
      <dt class="text-body-secondary">User</dt>
      <dd class="fw-semibold mb-0">{{ transaction.user.get_full_name|default:transaction.user.username|default:"—" }}</dd>
    </div>
  </dl>

  <form class="vstack gap-3" method="get" action="#">
    {% csrf_token %}
    <div>
      <label class="form-label small fw-semibold mb-1">Field</label>
      {{ form.field_name }}
    </div>
    <div>
      <label class="form-label small fw-semibold mb-1">Old value</label>
      {{ form.old_value }}
    </div>
    <div>
      <label class="form-label small fw-semibold mb-1">New value</label>
      {{ form.new_value }}
    </div>
  </form>
  <div>
    <div class="small fw-semibold mb-1">Note</div>
    <div class="form-control bg-body-secondary transaction-note-text" role="textbox" aria-readonly="true">{{ transaction.note|default:"—" }}</div>
  </div>
</div>
