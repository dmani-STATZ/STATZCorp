<!doctype html>
<!--
  Standalone, no-server smoke test for the DOM-free game logic. Open directly in
  a browser (file://) — it exercises rng determinism, the object pool, collision
  helpers, and weapon spread counts. Not part of the Django app.
-->
<html>
<head><meta charset="utf-8"><title>Marauder self-test</title>
<style>body{font:13px monospace;background:#05060f;color:#cfe} .ok{color:#5f5} .fail{color:#f66}</style>
</head>
<body>
<h3>Backyard Marauder — logic self-test</h3>
<div id="out"></div>
<script type="module">
import { makeRng } from "./rng.js";
import { Pool } from "./pool.js";
import { aabb, hitsPlayer } from "./collision.js";
import { WEAPONS } from "./weapons.js";
import { createDirector, updateDirector } from "./director.js";
import { createPools } from "./entities.js";
import { WAVE_INTERVAL, HAULER_UNLOCK_S, MAX_HAULERS_PER_WAVE, BOSS_EVERY_M, MAX_LIVE_ENEMIES, SPAWN_SOFT_CAP_FRAC, BOSS_CLEAR_THRESHOLD } from "./const.js";
import { pincer, EARLY_FORMATIONS } from "./formations.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
function check(name, cond) {
    const div = document.createElement("div");
    div.className = cond ? "ok" : "fail";
    div.textContent = (cond ? "PASS " : "FAIL ") + name;
    out.appendChild(div);
    cond ? pass++ : fail++;
}

// rng determinism
const a = makeRng("seed-123"); const b = makeRng("seed-123");
let same = true;
for (let i = 0; i < 100; i++) if (a.next() !== b.next()) same = false;
check("rng deterministic for same seed", same);
check("rng differs across seeds", makeRng("x").next() !== makeRng("y").next());
check("rng.int within range", (() => { const r = makeRng("z"); for (let i=0;i<1000;i++){const v=r.int(3,7); if(v<3||v>7)return false;} return true; })());

// pool
const p = new Pool(4, () => ({ v: 0 }), (o) => { o.v = 0; });
const o1 = p.acquire(); o1.v = 1;
const o2 = p.acquire(); o2.v = 2;
check("pool count after 2 acquire", p.count === 2);
p.releaseAt(0);
check("pool count after release", p.count === 1);
p.acquire(); p.acquire(); p.acquire();
check("pool respects capacity (null when full)", p.acquire() === null);
p.clear();
check("pool clear empties", p.count === 0);

// collision
check("aabb overlap true", aabb({x:0,y:0,w:10,h:10},{x:4,y:4,w:10,h:10}));
check("aabb overlap false", !aabb({x:0,y:0,w:4,h:4},{x:50,y:50,w:4,h:4}));
check("hitsPlayer close", hitsPlayer({x:0,y:0,radius:5},{x:2,y:2,w:4,h:4}));
check("hitsPlayer far", !hitsPlayer({x:0,y:0,radius:5},{x:80,y:80,w:4,h:4}));

// weapon spread counts (fake game with a counting pool)
function fakeGame() {
    return {
        pools: { pBullets: new Pool(64, () => ({}), null) },
        player: { x: 160, y: 200 },
        rng: makeRng("w"),
    };
}
let g = fakeGame();
WEAPONS.scatter.fire(g, g.player, 1);
check("scatter tier1 emits 2 pellets", g.pools.pBullets.count === 2);
g = fakeGame();
WEAPONS.scatter.fire(g, g.player, 5);
check("scatter tier5 emits 6 pellets", g.pools.pBullets.count === 6);
g = fakeGame();
WEAPONS.vulcan.fire(g, g.player, 1);
check("vulcan tier1 emits 2 bolts", g.pools.pBullets.count === 2);

// ---- director.js -----------------------------------------------------
//
// Phase 1 rewrote this module's difficulty ramp. These checks exist to
// guard the three specific regressions that were fixed, plus the
// determinism property the GDD calls out as the primary JS test strategy.
// If any of these fail, do NOT loosen the assertion to force a pass --
// report the failure. A failure here means the ramp fix regressed, which
// is exactly the class of bug this file exists to catch before a human
// notices it thirty seconds into a run.

// A fully deterministic stand-in for game.rng. Real seeded randomness is
// exercised separately below (the determinism test uses makeRng for real);
// this stub exists so the hauler-cap and wave-size tests can force specific
// branches without hunting for a "lucky" seed.
function stubRng({ chance = true, pickIndex = 0 } = {}) {
    return {
        next: () => 0.5,
        range: (lo) => lo,
        int: (lo) => lo,
        pick: (arr) => arr[pickIndex],
        chance: () => chance,
    };
}

function snapshotEnemies(game) {
    const pool = game.pools.enemies;
    const out = [];
    for (let i = 0; i < pool.count; i++) {
        const e = pool.active[i];
        out.push(e.type + ":" + Math.round(e.x) + "," + Math.round(e.y) + ":" + e.hp);
    }
    return out.sort().join("|");
}

// Determinism: two independently-constructed games seeded identically must
// produce byte-identical enemy spawn sequences at every checkpoint. Uses
// coarse dt=1 steps across 90 "seconds" of sim time (real seeded rng, not
// the stub) -- determinism only requires the two runs match each other, not
// that the stepping matches real 60Hz gameplay pacing, so this is both valid
// and cheap. Also exercises at least one boss spawn (distanceM crosses
// BOSS_EVERY_M around t=75 with the progression below).
{
    function makeDeterminismGame(seed) {
        return {
            pools: createPools(),
            rng: makeRng(seed),
            elapsed: 0,
            distanceM: 0,
            boss: null,
            wave: 0,
            director: createDirector(),
        };
    }
    const gA = makeDeterminismGame("selftest-determinism-seed");
    const gB = makeDeterminismGame("selftest-determinism-seed");
    let allMatch = true;
    for (let t = 1; t <= 90; t++) {
        gA.elapsed = t; gB.elapsed = t;
        gA.distanceM = t * 20; gB.distanceM = t * 20;
        updateDirector(gA, 1);
        updateDirector(gB, 1);
        if (snapshotEnemies(gA) !== snapshotEnemies(gB)) { allMatch = false; break; }
    }
    check("director.js: same seed produces identical wave sequence", allMatch);
}

function fireOneWave(elapsed, rngOpts) {
    const game = {
        pools: createPools(),
        rng: stubRng(rngOpts),
        elapsed,
        distanceM: 0,
        boss: null,
        wave: 0,
        director: createDirector(),
    };
    updateDirector(game, WAVE_INTERVAL); // forces exactly one wave tick
    return game;
}

// Regression: wave size must GROW with elapsed time, not flatten. The
// original bug hardcoded a 12-purchase ceiling, so every budget point earned
// after ~36s was silently discarded -- this compares an early wave to a late
// one and asserts the late one is actually bigger.
{
    const early = fireOneWave(10, { chance: true });
    const late = fireOneWave(200, { chance: true });
    check(
        "director.js: wave size grows with elapsed instead of flattening",
        late.pools.enemies.count > early.pools.enemies.count
    );
}

// Regression: rolling a hauler must NOT end the wave early. chance() is
// forced to always succeed so every eligible purchase attempts a hauler;
// once MAX_HAULERS_PER_WAVE is hit, the wave must keep buying non-hauler
// formations instead of stopping (the original bug did `break` on any
// hauler roll, so difficulty visibly dropped the moment haulers unlocked).
{
    const g = fireOneWave(HAULER_UNLOCK_S + 5, { chance: true });
    const enemies = g.pools.enemies.active.slice(0, g.pools.enemies.count);
    const haulers = enemies.filter((e) => e.type === "hauler").length;
    const others = enemies.length - haulers;
    check("director.js: hauler count respects MAX_HAULERS_PER_WAVE", haulers === MAX_HAULERS_PER_WAVE);
    check("director.js: wave keeps buying after the hauler cap (not ending early)", others > 0);
}

// Regression: a boss-due tick must NOT silently advance nextBossM and skip
// the boss when the enemy pool is full. The original bug advanced the
// milestone regardless of whether spawnEnemy actually succeeded.
{
    const game = {
        pools: createPools(),
        rng: stubRng({}),
        elapsed: 100,
        distanceM: BOSS_EVERY_M,
        boss: null,
        wave: 0,
        director: createDirector(),
    };
    while (game.pools.enemies.acquire()) { /* fill the pool to capacity */ }
    const beforeNextBoss = game.director.nextBossM;
    updateDirector(game, 0.016);
    check(
        "director.js: nextBossM does not advance when the boss spawn fails (pool full)",
        game.director.nextBossM === beforeNextBoss
    );
}

// Regression: pincer (spawns at both screen edges simultaneously) must not be
// selectable during the opening window -- that's the exact mechanic behind
// "enemies spread across the entire screen, can't reach them."
check(
    "formations.js: EARLY_FORMATIONS excludes pincer",
    !EARLY_FORMATIONS.includes(pincer)
);

// Soft cap: the wave spend-loop must stop buying formations when the live
// enemy count is at or above SPAWN_SOFT_CAP (80% of MAX_LIVE_ENEMIES).
// Fill the pool just above the soft cap and confirm no new enemies spawn.
{
    const g = {
        pools: createPools(),
        rng: stubRng({ chance: true }),
        elapsed: 10,
        distanceM: 0,
        boss: null,
        wave: 0,
        director: createDirector(),
    };
    // Acquire exactly SPAWN_SOFT_CAP enemies so the pool is at the threshold.
    const SOFT = Math.floor(MAX_LIVE_ENEMIES * SPAWN_SOFT_CAP_FRAC);
    for (let i = 0; i < SOFT; i++) g.pools.enemies.acquire();
    const before = g.pools.enemies.count;
    updateDirector(g, WAVE_INTERVAL); // trigger a wave
    check(
        "director.js: soft cap stops purchases when screen is at 80% of MAX_LIVE_ENEMIES",
        g.pools.enemies.count === before  // no new enemies beyond the soft cap
    );
}

// Pre-boss quiet period: hitting the distance milestone must set preBoss=true
// and NOT spawn the Enforcer immediately (the pool is not full here so it's
// not a capacity issue — the director must be intentionally waiting).
{
    const g = {
        pools: createPools(),
        rng: stubRng({}),
        elapsed: 100,
        distanceM: BOSS_EVERY_M,   // exactly at the first milestone
        boss: null,
        wave: 0,
        director: createDirector(),
    };
    updateDirector(g, 0.016);  // one tick
    const bossSpawnedImmediately = g.boss !== null;
    const preBossSet = g.director.preBoss === true;
    check(
        "director.js: boss milestone sets preBoss without spawning immediately",
        !bossSpawnedImmediately && preBossSet
    );
}

// Pre-boss fires early when enemies drain to BOSS_CLEAR_THRESHOLD.
// Simulate entering preBoss with a near-empty field; the very next tick
// should spawn the Enforcer without waiting the full BOSS_CLEAR_WAIT_S.
{
    const g = {
        pools: createPools(),
        rng: stubRng({}),
        elapsed: 100,
        distanceM: BOSS_EVERY_M + 1,  // already past milestone
        boss: null,
        wave: 0,
        director: { ...createDirector(), preBoss: true, preBossTimer: 999 },
        banner: "", bannerMs: 0,
        audio: null,
    };
    // Put BOSS_CLEAR_THRESHOLD - 1 enemies on the field (field is "clear enough")
    for (let i = 0; i < BOSS_CLEAR_THRESHOLD - 1; i++) g.pools.enemies.acquire();
    updateDirector(g, 0.016);
    check(
        "director.js: pre-boss fires early when enemies <= BOSS_CLEAR_THRESHOLD",
        g.boss !== null
    );
}

const summary = document.createElement("h3");
summary.textContent = `${pass} passed, ${fail} failed`;
summary.className = fail ? "fail" : "ok";
out.appendChild(summary);
</script>
</body>
</html>
