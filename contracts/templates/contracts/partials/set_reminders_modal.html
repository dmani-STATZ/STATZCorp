{% load static %}
<div id="setRemindersRoot"
     class="d-none"
     data-presets-url="{% url 'contracts:reminder_presets_api' contract_id=contract.id %}"
     data-bulk-url="{% url 'contracts:reminder_bulk_create_api' contract_id=contract.id %}"
     data-contract-id="{{ contract.id }}"
     data-contract-number="{{ contract.contract_number }}"></div>

<div class="modal fade" id="promptSetRemindersModal" tabindex="-1" aria-labelledby="promptSetRemindersModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="promptSetRemindersModalLabel">Set reminders?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        PO marked as sent to supplier. Do you want to set check-in reminders for this contract?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Not now</button>
        <button type="button" class="btn btn-success" id="promptSetRemindersConfirmBtn">Set Reminders</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="setRemindersModal" tabindex="-1" aria-labelledby="setRemindersModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="setRemindersModalLabel">Set Reminders</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="setRemindersLoadError" class="alert alert-danger d-none" role="alert">
          Could not load reminder presets.
        </div>
        <div id="setRemindersLoading" class="text-center py-4 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
        </div>
        <div id="setRemindersTableWrap" class="d-none">
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-2" id="setRemindersTable">
              <thead>
                <tr>
                  <th scope="col" class="text-center" style="width: 2.5rem;"></th>
                  <th scope="col">Reminder</th>
                  <th scope="col">Applies to</th>
                  <th scope="col">Date</th>
                  <th scope="col" class="text-end" style="width: 3rem;"></th>
                </tr>
              </thead>
              <tbody id="setRemindersTableBody"></tbody>
            </table>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="setRemindersAddRowBtn">+ Add date</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="setRemindersSaveBtn" disabled>
          <span id="setRemindersSaveBtnLabel">Save Reminders (0)</span>
          <span id="setRemindersSaveSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</div>
