{% for contract in contracts %}
<a href="{% url 'contracts:contract_management' contract.pk %}" class="list-group-item list-group-item-action" data-search-pk="{{ contract.pk }}">
    <span class="font-monospace fw-semibold">{{ contract.contract_number }}</span>
    {% if contract.status %}<span class="badge text-bg-secondary ms-2">{{ contract.status.description }}</span>{% endif %}
</a>
{% endfor %}
